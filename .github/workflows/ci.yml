# Typechecks, tests and builds the script on every push and pull request.
name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

defaults:
  run:
    working-directory: CavalrYTP

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: CavalrYTP/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: CavalrYTP/package.json
          cache: pnpm
          cache-dependency-path: CavalrYTP/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Build the script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: CavalrYTP/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: CavalrYTP/package.json
          cache: pnpm
          cache-dependency-path: CavalrYTP/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v5
        with:
          name: CavalrYTP
          path: CavalrYTP/dist
          if-no-files-found: error

  release:
    name: Create Release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: CavalrYTP
          path: CavalrYTP/dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CavalrYTP/dist/*